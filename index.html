<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pogranicza: Droga do Korony</title>
  <meta name="description" content="Średniowieczna gra strategiczna: odbuduj osadę, rozwijaj władcę i towarzyszy, szkol wojsko i walcz o koronę.">
  <meta name="theme-color" content="#1b1610">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="top" class="top"></header>
  <main id="view" class="view"></main>
  <nav id="nav" class="nav">
    <button data-a="go" data-p="city" data-p2="city"><span>🏰</span>Osada</button>
    <button data-a="go" data-p="map"><span>🗺️</span>Mapa</button>
    <button data-a="go" data-p="army"><span>⚔️</span>Wojsko<i class="badge hidden"></i></button>
    <button data-a="go" data-p="heroes"><span>🎖️</span>Drużyna</button>
    <button data-a="go" data-p="board"><span>📋</span>Tablica<i class="badge hidden"></i></button>
    <button data-a="go" data-p="alliance"><span>🚩</span>Sojusz</button>
    <button data-a="go" data-p="more"><span>☰</span>Więcej<i class="badge hidden"></i></button>
  </nav>
  <div id="modal" class="modal hidden">
    <div class="backdrop" data-a="close"></div>
    <div id="modalCard" class="modalCard">
      <button class="mClose" data-a="close" aria-label="Zamknij">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/army.js"></script>
  <script src="js/world.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/city.js"></script>
  <script src="js/mapview.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
